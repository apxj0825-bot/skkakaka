<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered PDF Studio & Image Generator</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #c97d24;
            --bg-color: #faf8f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; display: flex;
            background-color: #e2e8f0; height: 100vh; overflow: hidden;
        }

        /* لوحة التحكم الجانبية (بالعربية لتسهيل الاستخدام) */
        .sidebar {
            width: 35%; background: #ffffff; padding: 25px;
            box-shadow: 2px 0 15px rgba(0,0,0,0.1); overflow-y: auto; z-index: 10;
            direction: rtl;
        }

        /* حاوية المعاينة للـ PDF */
        .preview-container {
            width: 65%; padding: 30px; overflow-y: auto;
            display: flex; flex-direction: column; align-items: center;
        }

        /* ورقة الـ PDF النهائية (بالإلكترونية بالكامل وبدون أي لغة عربية) */
        .pdf-page {
            width: 210mm; min-height: 297mm; background: var(--bg-color);
            padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            box-sizing: border-box; position: relative;
            direction: ltr;
        }

        /* عناصر أدوات التحكم */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #2d3748; }
        input, textarea {
            width: 100%; padding: 10px; border: 1px solid #cbd5e0;
            border-radius: 6px; box-sizing: border-box; font-size: 13px;
        }
        
        .file-upload-btn {
            background: #2b6cb0; color: white; padding: 12px; text-align: center;
            border-radius: 6px; font-weight: bold; cursor: pointer; display: block; margin-bottom: 15px;
        }
        .file-upload-btn:hover { background: #2c5282; }
        input[type="file"] { display: none; }

        .btn {
            color: white; border: none; padding: 12px 20px; border-radius: 6px;
            cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 15px;
        }
        .btn-ai { background: #805ad5; } 
        .btn-ai:hover { background: #6b46c1; }
        .btn-download { background: #38a169; }
        .btn-download:hover { background: #2f855a; }

        .status-box {
            font-size: 13px; padding: 10px; border-radius: 6px; margin-top: 10px; text-align: center; display: none;
        }
        .status-loading { background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; }
        .status-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

        /* --- تنسيقات ستايل الـ PDF الداخلي (خالي من العربي) --- */
        .pdf-header {
            background-color: var(--primary-color); color: white;
            margin: -30px -30px 25px -30px; padding: 35px 30px;
            border-bottom: 5px solid var(--secondary-color);
        }
        .pdf-header h1 { margin: 0; font-size: 26px; font-weight: bold; letter-spacing: 0.5px; }
        .pdf-header p { margin: 6px 0 0 0; font-size: 13px; opacity: 0.85; }

        /* شبكة تقسيم المقاطع الستة */
        .pdf-grid-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px;
        }
        
        .section-block {
            background: #ffffff; border-radius: 6px; padding: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03); border-top: 4px solid var(--primary-color);
            display: flex; flex-direction: column;
        }

        /* شارة التمييز للعنوان والتأشير على النقاط المهمة */
        .highlight-badge {
            background-color: #fffaf0; border: 1px solid var(--secondary-color);
            color: #b7791f; font-size: 11px; font-weight: bold;
            padding: 3px 8px; border-radius: 4px; display: inline-block;
            margin-bottom: 8px; width: fit-content; text-transform: uppercase;
        }

        .section-text {
            font-size: 12px; color: #2d3748; line-height: 1.6;
            margin: 0 0 12px 0; font-weight: 500; text-align: justify;
        }

        .section-image {
            width: 100%; height: 160px; object-fit: cover;
            border-radius: 4px; border: 1px solid #e2e8f0; margin-top: auto;
            background-color: #f7fafc; display: none;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="color: var(--primary-color); margin-top: 0; margin-bottom: 5px;">لوحة تحكم الـ PDF الذكية</h2>
        <p style="font-size: 12px; color: #718096; margin-bottom: 20px;">ارفع ملف الـ PDF، وسيقوم النظام بتجزئته تلقائياً لـ 6 مقاطع وتوليد صور مخصصة لها بالكامل.</p>
        
        <label class="file-upload-btn" for="pdf-file-input">📂 رفع ملف PDF لمعالجته</label>
        <input type="file" id="pdf-file-input" accept="application/pdf" onchange="processUploadedPDF(event)">
        
        <div id="upload-status" class="status-box status-loading">جاري قراءة واستخراج 6 مقاطع من ملفك...</div>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

        <div class="form-group">
            <label>عنوان المستند الرئيسي (PDF Title):</label>
            <input type="text" id="input-title" value="ACADEMIC STUDY GUIDE" oninput="liveUpdatePreview()">
        </div>
        <div class="form-group">
            <label>الوصف الفرعي (Subtitle):</label>
            <input type="text" id="input-subtitle" value="AI-Generated Visual Report & Insights" oninput="liveUpdatePreview()">
        </div>

        <div id="sections-inputs-container"></div>

        <button class="btn btn-ai" onclick="generateAllAIImages()">🤖 توليد وصنع الـ 6 صور من النصوص</button>
        <div id="ai-status" class="status-box status-loading" style="margin-top: 10px;">جاري تشغيل واجهة الذكاء الاصطناعي لتصميم الصور...</div>
        
        <button class="btn btn-download" style="margin-top: 15px;" onclick="exportCleanPDF()">📥 تحميل ملف PDF الجاهز (English Only)</button>
    </div>

    <div class="preview-container">
        <div class="pdf-page" id="pdf-content">
            
            <div class="pdf-header">
                <h1 id="view-title">ACADEMIC STUDY GUIDE</h1>
                <p id="view-subtitle">AI-Generated Visual Report & Insights</p>
            </div>

            <div class="pdf-grid-container" id="pdf-sections-grid"></div>

        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // البيانات الافتراضية للمقاطع الستة في حال لم يقم المستخدم برفع ملف بعد
        let sectionsData = [
            { key: "SECTION 01", text: "Wuthering Heights is a classic gothic novel published in 1847 by Emily Brontë under the pen name Ellis Bell. It explores intense themes of love, revenge, and social class structure." },
            { key: "SECTION 02", text: "The setting of the story takes place in the wild, windy Yorkshire moors. It heavily focuses on two contrasting houses separated by deep valleys: Wuthering Heights and Thrushcross Grange." },
            { key: "SECTION 03", text: "Heathcliff, the central dark character, enters as an orphan from Liverpool. His complex relationships and desire for ultimate revenge drive the main narrative forward across multiple generations." },
            { key: "SECTION 04", text: "The story features an unreliable narration technique through Lockwood and Nelly Dean, forcing readers to critically evaluate the emotional motives behind every dark family secret." },
            { key: "SECTION 05", text: "Catherine Earnshaw stands caught between her raw, spiritual passion for Heathcliff and her superficial desire for Edgar Linton's civilized wealth and high social status." },
            { key: "SECTION 06", text: "The conclusion brings a peaceful resolution to the generational curse through the redemption and upcoming marriage of Hareton Earnshaw and the young, pure Catherine Linton." }
        ];

        // تشغيل البناء الأولي للصفحة عند فتحها
        window.onload = function() {
            renderInputsAndGrid();
        };

        function renderInputsAndGrid() {
            const inputsContainer = document.getElementById('sections-inputs-container');
            const gridContainer = document.getElementById('pdf-sections-grid');
            
            inputsContainer.innerHTML = '';
            gridContainer.innerHTML = '';

            sectionsData.forEach((section, index) => {
                // 1. إنشاء حقول التعديل في اللوحة الجانبية
                const group = document.createElement('div');
                group.style.background = '#f8fafc';
                group.style.padding = '10px';
                group.style.borderRadius = '6px';
                group.style.marginBottom = '12px';
                group.style.border = '1px solid #e2e8f0';
                
                group.innerHTML = `
                    <label style="color: var(--primary-color);">📌 المقطع ${index + 1} - شارة التمييز والنص الأساسي:</label>
                    <input type="text" id="input-key-${index}" value="${section.key}" style="margin-bottom:5px;" oninput="syncData(${index})">
                    <textarea id="input-text-${index}" rows="3" oninput="syncData(${index})">${section.text}</textarea>
                `;
                inputsContainer.appendChild(group);

                // 2. إنشاء كتل التصميم داخل ورقة الـ PDF (النص في الأعلى فوق الصورة وبخط واضح جداً)
                const block = document.createElement('div');
                block.className = 'section-block';
                block.innerHTML = `
                    <div class="highlight-badge" id="view-key-${index}">${section.key}</div>
                    <p class="section-text" id="view-text-${index}">${section.text}</p>
                    <img class="section-image" id="view-img-${index}" alt="AI Visual">
                `;
                gridContainer.appendChild(block);
            });
        }

        function syncData(index) {
            sectionsData[index].key = document.getElementById(`input-key-${index}`).value;
            sectionsData[index].text = document.getElementById(`input-text-${index}`).value;
            
            document.getElementById(`view-key-${index}`).innerText = sectionsData[index].key;
            document.getElementById(`view-text-${index}`).innerText = sectionsData[index].text;
        }

        function liveUpdatePreview() {
            document.getElementById('view-title').innerText = document.getElementById('input-title').value;
            document.getElementById('view-subtitle').innerText = document.getElementById('input-subtitle').value;
        }

        // دالة قراءة أي ملف PDF مرفوع وتجزئته بالتساوي إلى 6 مقاطع منفصلة
        async function processUploadedPDF(event) {
            const file = event.target.files[0];
            if (!file) return;

            const status = document.getElementById('upload-status');
            status.className = "status-box status-loading";
            status.innerText = "⏳ جاري تحليل المستند المرفوع وتقسيمه إلى 6 أجزاء نصية...";
            status.style.display = "block";

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";

                // استخراج النصوص من كافة الصفحات
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullText += content.items.map(item => item.str).join(' ') + " ";
                }

                // تنظيف النصوص البرمجية وفصلها بناءً على النقاط وعلامات الترقيم
                let cleanSentences = fullText.split(/[.]+/)
                                             .map(s => s.trim())
                                             .filter(s => s.length > 20 && !/[\\u0600-\\u06FF]/.test(s)); // فلترة لمنع تداخل أي نصوص عربية

                if(cleanSentences.length < 6) {
                    cleanSentences = fullText.match(/.{1,180}/g) || [fullText];
                }

                // توزيع المدخلات المستخرجة على الـ 6 بطاقات بالتساوي
                for(let i = 0; i < 6; i++) {
                    let textChunk = cleanSentences[i] || "Relevant academic and research summary details extracted automatically from the uploaded core document.";
                    if(textChunk.length > 220) textChunk = textChunk.substring(0, 220) + "...";
                    
                    sectionsData[i].text = textChunk;
                    sectionsData[i].key = `KEY INSIGHT 0${i+1}`;
                }

                // إعادة بناء الواجهة بالبيانات الجديدة
                renderInputsAndGrid();
                document.getElementById('input-title').value = file.name.replace('.pdf', '').toUpperCase();
                liveUpdatePreview();

                status.className = "status-box status-success";
                status.innerText = "✅ تم فك وتوزيع نصوص ملفك على المقاطع الستة بنجاح!";
                setTimeout(() => status.style.display = 'none', 3000);

            } catch (err) {
                console.error(err);
                status.className = "status-box";
                status.style.background = "#fee2e2"; status.style.color = "#991b1b";
                status.innerText = "❌ فشل استخراج النصوص، تأكد أن ملف الـ PDF يحتوي على نصوص حقيقية وليس صوراً.";
            }
        }

        // دالة توليد الـ 6 صور في نفس الوقت اعتماداً على محتوى الـ 6 مقاقات
        function generateAllAIImages() {
            const status = document.getElementById('ai-status');
            status.className = "status-box status-loading";
            status.innerText = "⏳ جاري إرسال نصوص المقاطع الستة إلى محرك الذكاء الاصطناعي لإنشاء وتوليد الصور...";
            status.style.display = "block";

            let loadedImages = 0;

            sectionsData.forEach((section, index) => {
                const imgElement = document.getElementById(`view-img-${index}`);
                
                // صياغة أمر فني للذكاء الاصطناعي يدمج النص المستخرج مع ستايل فني عالي الدقة
                const promptQuery = encodeURIComponent(section.text.substring(0, 140) + ", highly detailed digital art concept illustration, cinematic lighting");
                const generatedSrc = `https://image.pollinations.ai/p/${promptQuery}?width=550&height=350&nologo=true&seed=${Math.floor(Math.random() * 8000) + index}`;

                const tempImg = new Image();
                tempImg.src = generatedSrc;
                tempImg.onload = function() {
                    imgElement.src = generatedSrc;
                    imgElement.style.display = "block";
                    loadedImages++;
                    
                    if (loadedImages === 6) {
                        status.className = "status-box status-success";
                        status.innerText = "✅ ممتاز! تم إنتاج الـ 6 صور بنجاح وموضعة الكلمات فوقها بدقة.";
                        setTimeout(() => status.style.display = 'none', 4000);
                    }
                };
            });
        }

        // تصدير وتحميل ملف PDF النظيف الخالي من العربية والمطابق تماماً للقياسات الرسمية A4
        function exportCleanPDF() {
            const element = document.getElementById('pdf-content');
            const docTitle = document.getElementById('input-title').value || 'AI_Document_Report';
            
            const options = {
                margin:       0,
                filename:     `${docTitle.replace(/\\s+/g, '_')}_AI_Edition.pdf`,
                image:        { type: 'jpeg', quality: 0.99 },
                html2canvas:  { scale: 2, useCORS: true }, // تفعيل الكورس لقراءة وضمان جودة الصور المولدة خارجياً
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(options).from(element).save();
        }
    </script>
</body>
</html>
